name: Firmware build

on:
  push:
    branches:
      - "**"
    paths:
      - "firmware/**"
      - ".gitmodules"
      - ".github/workflows/**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "firmware/**"
      - ".gitmodules"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  # Gałąź repo PUTM_EV_CAN_DBC, z której brane są pliki .dbc
  DBC_REF: soft-v2.0
  PROJECT_NAME: PUTM_EV_PDM_2024

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release]

    steps:
      # 1. Kod repozytorium (bez automatycznych submodułów – patrz krok 2)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # 2. Tylko submoduł CAN library. `--recursive` się wywala, bo
      #    hardware/.history jest zapisany jako submoduł bez wpisu w .gitmodules.
      - name: Init CAN library submodule
        run: git submodule update --init --depth 1 firmware/Components/PUTM_EV_CAN_LIBRARY

      # 3. Pliki .dbc z publicznego repo PUTM_EV_CAN_DBC
      - name: Checkout CAN DBC files
        uses: actions/checkout@v4
        with:
          repository: PUT-Motorsport/PUTM_EV_CAN_DBC
          ref: ${{ env.DBC_REF }}
          path: _dbc

      # Tylko główne pliki PUTM_CAN_*.dbc (bez katalogu Other_DBC_file)
      - name: Copy DBC files into CAN library
        run: cp -v _dbc/PUTM_CAN_M.dbc _dbc/PUTM_CAN_PT.dbc firmware/Components/PUTM_EV_CAN_LIBRARY/database/dbc/

      # 4. Narzędzia: ARM GCC, CMake, Ninja, Python + cantools
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            cmake ninja-build
          arm-none-eabi-gcc --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cantools
        run: pip install cantools==40.7.1

      # 5. Build
      - name: Configure
        working-directory: firmware
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: firmware
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Generate .hex / .bin
        working-directory: firmware/build/${{ matrix.preset }}
        run: |
          arm-none-eabi-objcopy -O ihex   ${PROJECT_NAME}.elf ${PROJECT_NAME}.hex
          arm-none-eabi-objcopy -O binary ${PROJECT_NAME}.elf ${PROJECT_NAME}.bin
          arm-none-eabi-size ${PROJECT_NAME}.elf | tee -a $GITHUB_STEP_SUMMARY

      # 6. Wyniki do pobrania z zakładki Actions
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.preset }}-${{ github.sha }}
          path: |
            firmware/build/${{ matrix.preset }}/*.elf
            firmware/build/${{ matrix.preset }}/*.hex
            firmware/build/${{ matrix.preset }}/*.bin
            firmware/build/${{ matrix.preset }}/*.map

  # 7. Po wypchnięciu taga v* – GitHub Release z plikami Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-Release-${{ github.sha }}
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
